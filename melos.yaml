name: looplet

packages:
  - packages/**
  - tools/**
  - app

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    description: Static analysis across all packages, plus flutter analyze for the app.
    steps:
      - melos exec --no-flutter -- "dart analyze ."
      - melos exec --scope="looplet_app" -- "flutter analyze"

  # Scope: the Dart code the workspace owns (app, packages, tools). Evidence
  # under ai-system/ is a record and is never reformatted (TD-FORMAT-SCOPE,
  # F08 architecture.md A15).
  format:
    description: Format the workspace's Dart code (app, packages, tools) in place.
    run: dart format app packages tools

  format:check:
    description: Fail if any workspace Dart code (app, packages, tools) is not formatted.
    run: dart format --output=none --set-exit-if-changed app packages tools

  test:
    description: Unit tests in every pure-Dart package with a test/ dir, plus the Flutter app.
    steps:
      - melos exec --dir-exists="test" --no-flutter -- "dart test"
      - melos exec --scope="looplet_app" -- "flutter test"

  build:app:
    description: Release build of the Flutter app (Android App Bundle).
    run: melos exec --scope="looplet_app" -- "flutter build appbundle --release"

  content:check:
    description: Validate every committed puzzle artifact under content/ (F06 content gate).
    run: >-
      melos exec --scope="looplet_authoring" --
      "dart run bin/looplet_authoring.dart check ../../content --repo-root ../.."

  content:sync:
    description: >-
      Mirror the authored Journey content (content/journey/**) into the app
      bundle (app/assets/journey/**) so `flutter build` picks it up (F05
      architecture.md §5.1). content/journey/ is the source of truth (the real
      30-level pack since F06-CONTENT); the F05 build gate fails on any drift.
    run: >-
      bash -c 'set -e; if [ -d content/journey ]; then mkdir -p app/assets/journey;
      rsync -a --delete content/journey/ app/assets/journey/;
      echo "synced content/journey -> app/assets/journey"; else
      echo "content/journey/ not present yet (interim pack is under app/assets/journey/) — skipped"; fi'

  content:journey:
    description: >-
      F05 Journey content-manifest build gate (f05 architecture.md §5.4). Runs
      inside `melos run test`. smoke mode logs a <30 shortfall; strict mode
      fails.
    run: >-
      melos exec --scope="looplet_app" --
      "flutter test test/journey/journey_manifest_gate_test.dart"

  test:integration:
    description: >-
      F03 play-session integration_test suite. Best-effort per release.md §4;
      the always-green mirror is app/test/play/play_session_runtime_test.dart
      (in `test`). Device-matrix run: `flutter test integration_test -d <device>`.
    run: melos exec --scope="looplet_app" -- "flutter test integration_test/"

  infra:build:
    description: Compile the Firebase Cloud Functions (TypeScript → lib/). F08.
    run: npm --prefix infra/functions ci && npm --prefix infra/functions run build

  infra:test:
    description: Run the Cloud Functions test suite (offline skeleton; rules suites need the emulator). F08.
    run: npm --prefix infra/functions test
