name: looplet_app
description: LOOPLET — mobile word-based logic puzzle.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # LOOPLET domain packages (pure Dart)
  looplet_core:
    path: ../packages/looplet_core
  looplet_dictionary:
    path: ../packages/looplet_dictionary
  looplet_engine:
    path: ../packages/looplet_engine
  looplet_content:
    path: ../packages/looplet_content

  # App infrastructure (per platform.md §3)
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Firebase — added by the infra/ DURUM 0 (F08, 2026-09-06; setup-manifest.md).
  # Not initialized in main.dart yet — F08-FE6 owns the guarded init sequence.
  # firebase_options.dart is generated by `flutterfire configure` once the
  # Firebase project exists (see infra/README.md).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_app_check: ^0.3.1+7
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.0
  # F05 — the Journey content-manifest gate test verifies asset checksums.
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  # Dictionary assets are declared by the looplet_dictionary package itself and
  # reach the bundle as packages/looplet_dictionary/assets/<lang>/dictionary.json.
  #
  # F05 Journey content pack: the per-language manifest + level artifacts.
  # Interim — the 5 files under assets/journey/tr/ re-id the F06 smoke set
  # (f05 architecture.md §5.5); F06-CONTENT delivers the real 30 (source of
  # truth `content/journey/<lang>/`, mirrored here by `melos run content:sync`).
  assets:
    - assets/journey/tr/

  # F00 design system (Design Foundation Selected 2026-09-21): Space Grotesk
  # (headings, tile glyphs, numerals) and Manrope (body, labels, CTAs), both
  # variable fonts under the SIL Open Font License 1.1 — licence texts sit
  # beside the files. The weight axis is selected with FontVariation('wght'),
  # see lib/design/typography.dart.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
