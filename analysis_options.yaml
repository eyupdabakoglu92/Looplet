# Shared analysis config for every LOOPLET package.
# Pure-Dart packages: `include: ../../analysis_options.yaml`
# app/ : includes this file plus package:flutter_lints/flutter.yaml

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat missing awaits and dead code as build-breaking in CI.
    unawaited_futures: warning
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_lambdas
    - use_super_parameters
