name: looplet_dictionary
description: >-
  Curated, language-scoped word list plus the validation service that gates
  frozen-tile thawing and target-word selection (F01). Pure Dart — no Flutter.
  Asset bundling is the app's responsibility (see README).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  looplet_core:
    path: ../looplet_core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

# Asset metadata consumed by the Flutter tool when the app depends on this
# package. The package stays pure Dart (no flutter SDK dependency); the app
# reads these via rootBundle as `packages/looplet_dictionary/assets/<lang>/dictionary.json`.
flutter:
  assets:
    - assets/tr/dictionary.json
    - assets/en/dictionary.json
