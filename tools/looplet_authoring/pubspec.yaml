name: looplet_authoring
description: >-
  Internal build-time level-authoring CLI for LOOPLET (F06): solve / playtest /
  export / check / fill. Never shipped in the app.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  args: ^2.5.0
  crypto: ^3.0.3
  path: ^1.9.0
  looplet_core:
    path: ../../packages/looplet_core
  looplet_engine:
    path: ../../packages/looplet_engine
  looplet_content:
    path: ../../packages/looplet_content
  looplet_solver:
    path: ../../packages/looplet_solver
  looplet_dictionary:
    path: ../../packages/looplet_dictionary

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
