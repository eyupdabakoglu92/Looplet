name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · analyze · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Content check
        run: >-
          melos exec --scope="looplet_authoring" --
          "dart run bin/looplet_authoring.dart check ../../content --repo-root ../.."

      - name: Build Android App Bundle
        run: melos run build:app

  infra:
    name: infra · functions build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ubuntu-latest ships Node 20; no setup-node action needed (keeps the
      # SHA-pinning surface minimal — see release.md §10).
      - name: Node version
        run: node --version

      - name: Install functions deps
        run: npm --prefix infra/functions ci

      - name: Build functions (tsc)
        run: npm --prefix infra/functions run build

      - name: Test functions (offline — validation + skeleton; emulator suites auto-skip)
        run: npm --prefix infra/functions test

      # Emulator run: un-skips test/rules.test.ts (@firebase/rules-unit-testing)
      # and test/submitDailyResult.test.ts (create-only write + reconciliation).
      # ubuntu-latest ships a JDK on PATH; firebase-tools comes via npx (no new
      # committed dep, no extra SHA-pinned action). demo- project id ⇒ fully
      # offline emulator, no auth. Per release.md §4.
      - name: Test functions (Firebase emulator — rules + callable behaviour)
        working-directory: infra
        run: >-
          npx --yes firebase-tools@15 emulators:exec
          --only firestore,auth --project demo-looplet
          "npm --prefix functions run test"

  ios-build:
    name: iOS release build (no codesign)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Build iOS (no codesign)
        run: melos exec --scope="looplet_app" -- "flutter build ios --release --no-codesign"
