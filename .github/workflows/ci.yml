name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Canonical toolchain (setup-manifest.md; F08 architecture.md A15,
# TD-CI-TOOLCHAIN): CI builds with the same Flutter every local QA verdict was
# produced on. A Flutter upgrade is a separate decision with full regression.
env:
  FLUTTER_VERSION: 3.32.8

jobs:
  verify:
    name: format · analyze · test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Toolchain versions
        run: flutter --version

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      # F03 play-session integration_test suite. Best-effort per release.md §4
      # ("failure is investigated, not auto-blocking"): the always-green mirror
      # is app/test/play/play_session_runtime_test.dart (run by `melos run test`
      # above). Headless flutter-tester is timing-sensitive for the drift-backed
      # boot; the authoritative device-matrix run is `flutter test
      # integration_test -d <emulator>`.
      - name: Integration tests (play session — best-effort)
        continue-on-error: true
        run: >-
          melos exec --scope="looplet_app" --
          "flutter test integration_test/"

      - name: Content check
        run: >-
          melos exec --scope="looplet_authoring" --
          "dart run bin/looplet_authoring.dart check ../../content --repo-root ../.."

      - name: Build Android App Bundle
        run: melos run build:app

  infra:
    name: infra · functions build + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      # firebase-tools 15 refuses Java < 21 and uses the first `java` on PATH
      # (CI-EMULATOR-JAVA21; F08 architecture.md A15). setup-java puts Temurin
      # 21 first on PATH and sets JAVA_HOME; the runner's default JDK is 17.
      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 (node24)
        with:
          distribution: temurin
          java-version: '21'

      # The runner's own Node is used; no setup-node action (keeps the
      # SHA-pinning surface minimal — see release.md §10).
      - name: Toolchain versions
        run: |
          node --version
          java -version

      - name: Install functions deps
        run: npm --prefix infra/functions ci

      - name: Build functions (tsc)
        run: npm --prefix infra/functions run build

      - name: Test functions (offline — validation + skeleton; emulator suites auto-skip)
        run: npm --prefix infra/functions test

      # Emulator run: un-skips test/rules.test.ts (@firebase/rules-unit-testing)
      # and test/submitDailyResult.test.ts (create-only write + reconciliation).
      # Java 21 comes from the setup step above; firebase-tools comes via npx
      # (no new committed dep). demo- project id ⇒ fully offline emulator, no
      # auth. Per release.md §4.
      - name: Test functions (Firebase emulator — rules + callable behaviour)
        working-directory: infra
        run: >-
          npx --yes firebase-tools@15 emulators:exec
          --only firestore,auth --project demo-looplet
          "npm --prefix functions run test"

  ios-build:
    name: iOS release build (no codesign)
    # Xcode >= 16.4 with Swift 6 (TD-CI-TOOLCHAIN): the Firebase iOS SDK uses
    # Swift 6 syntax; macos-14's Xcode cannot compile it.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      # Pin the canonical local Xcode (16.4) instead of the image default, and
      # stop with a clear message if the image no longer ships it.
      - name: Select Xcode 16.4
        run: |
          if [ ! -d /Applications/Xcode_16.4.app ]; then
            echo "::error::Xcode 16.4 is not installed on this runner image"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Toolchain versions
        run: flutter --version

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      # iOS plugins resolve through CocoaPods, as locally (Podfile.lock); SPM
      # stays off (TD-CI-TOOLCHAIN).
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Build iOS (no codesign)
        run: melos exec --scope="looplet_app" -- "flutter build ios --release --no-codesign"
