name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · analyze · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Build Android App Bundle
        run: melos run build:app

  ios-build:
    name: iOS release build (no codesign)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Build iOS (no codesign)
        run: melos exec --scope="looplet_app" -- "flutter build ios --release --no-codesign"
