name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · analyze · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Format check
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

      - name: Content check
        run: >-
          melos exec --scope="looplet_authoring" --
          "dart run bin/looplet_authoring.dart check ../../content --repo-root ../.."

      - name: Build Android App Bundle
        run: melos run build:app

  infra:
    name: infra · functions build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ubuntu-latest ships Node 20; no setup-node action needed (keeps the
      # SHA-pinning surface minimal — see release.md §10).
      - name: Node version
        run: node --version

      - name: Install functions deps
        run: npm --prefix infra/functions ci

      - name: Build functions (tsc)
        run: npm --prefix infra/functions run build

      - name: Test functions (offline skeleton; rules suites run when an emulator is present)
        run: npm --prefix infra/functions test
      # TODO(F08-BE5 / F08-DEVOPS): add a Firebase-emulator step
      # (`firebase emulators:exec --only firestore,auth "npm test"`) so the
      # @firebase/rules-unit-testing suites in test/rules.test.ts run in CI —
      # per release.md §4. Needs firebase-tools + Java on the runner.

  ios-build:
    name: iOS release build (no codesign)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          channel: stable
          cache: true

      - name: Activate melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap
        run: melos bootstrap

      - name: Build iOS (no codesign)
        run: melos exec --scope="looplet_app" -- "flutter build ios --release --no-codesign"
